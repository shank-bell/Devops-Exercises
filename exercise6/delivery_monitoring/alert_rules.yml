groups:
  - name: delivery_alerts
    rules:
      - alert: HighPendingDeliveries
        expr: pending_deliveries > 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Too many pending deliveries"
          description: "pending_deliveries is {{ $value }} (threshold 10) for more than 15s"

      - alert: HighAverageDeliveryTime
        expr: rate(delivery_time_seconds_sum[1m]) / rate(delivery_time_seconds_count[1m]) > 30
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Average delivery time too high"
          description: "Average delivery time is {{ $value }}s (threshold 30s)"
