global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Python delivery metrics app running on the host
  # host.docker.internal on Windows/macOS; use 172.17.0.1 on Linux/WSL
  - job_name: delivery_service
    static_configs:
      - targets: ["host.docker.internal:8000"]
